name: Test BigQuery connection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check Google Cloud variables
        shell: bash
        run: |
          for name in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty. Add it under Settings → Secrets and variables → Actions → Variables."
              exit 1
            fi
          done

          if [[ ! "$GCP_WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/[:space:]]+/providers/[^/[:space:]]+$ ]]; then
            echo "::error::GCP_WIF_PROVIDER must be the full provider path with a numeric project number."
            exit 1
          fi

          echo "All three Google Cloud variables are set."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BigQuery client
        run: python -m pip install google-cloud-bigquery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Test query and GDELT table access
        run: |
          python - <<'PY'
          import os
          from google.cloud import bigquery

          with bigquery.Client(
              project=os.environ["GCP_PROJECT_ID"],
              location="US",
          ) as client:
              row = next(iter(client.query("SELECT 1 AS connected").result()))
              print(f"BigQuery query succeeded: {row.connected}")

              table = client.get_table("gdelt-bq.gdeltv2.events_partitioned")
              print(f"GDELT table accessible: {table.full_table_id}")
          PY
